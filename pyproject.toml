[project]
name = "justicemonumentsimulator"
version = "0.1.0"
description = "Idleon Justice Monument simulator with CLI and Qt GUI."
readme = "README.md"
license = "Unlicense"
license-files = ["UNLICENSE"]
requires-python = ">=3.12"
dependencies = [
    "coverage>=7.6.0",
    "jsonschema>=4.25.1",
    "pydantic>=2.0.0",
    "prompt_toolkit>=3.0.0",
    "PySide6>=6.7.0",
    "rich>=13.0.0",
]

[project.scripts]
justice-sim = "justice_sim.ui_cli.cli:main"
justice-sim-gui = "justice_sim.ui_qt.app:main"

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
